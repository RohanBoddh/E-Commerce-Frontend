<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ecBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874f0"/>
      <stop offset="50%" stop-color="#1259c7"/>
      <stop offset="100%" stop-color="#0d3880"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="ecBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Bag Gradient -->
    <linearGradient id="ecBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Spark / Flash Accent Gradient -->
    <linearGradient id="ecAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ff9f00"/>
      <stop offset="100%" stop-color="#fb641b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ecGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ecBgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#ecBorderGrad)" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- Shopping Bag Body -->
  <path d="M18 24 C18 22.895 18.895 22 20 22 H44 C45.105 22 46 22.895 46 24 L48 48 C48 49.657 46.657 51 45 51 H19 C17.343 51 16 49.657 16 48 L18 24 Z" fill="url(#ecBagGrad)"/>

  <!-- Shopping Bag Handle -->
  <path d="M25 22 V18 C25 14.134 28.134 11 32 11 C35.866 11 39 14.134 39 18 V22" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Shopping Bag Handle Cutout Anchor Holes -->
  <circle cx="26" cy="26" r="1.8" fill="#cbd5e1"/>
  <circle cx="38" cy="26" r="1.8" fill="#cbd5e1"/>

  <!-- Vibrant Flipkart/Amazon Smile-Lightning Fast Delivery Emblem -->
  <g filter="url(#ecGlow)">
    <!-- Fast Delivery Bolt on Bag -->
    <path d="M33 27 L25 38 H32 L30 47 L40 35 H33 L35 27 Z" fill="url(#ecAccentGrad)"/>
  </g>

  <!-- Speed / Sparkle Accents -->
  <path d="M48 14 L50 16 L48 18 L46 16 Z" fill="#ffe600"/>
  <circle cx="15" cy="18" r="1.5" fill="#93c5fd"/>
</svg>
